name: PR Build Check

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'boards/**'
      - 'arch/**'
      - 'lib/**'
      - 'scripts/**'
      - 'platformio.ini'
      - '.github/actions/setup-build-environment/**'
      - '.github/workflows/pr-build-check.yml'
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'boards/**'
      - 'arch/**'
      - 'lib/**'
      - 'scripts/**'
      - 'platformio.ini'
      - '.github/actions/setup-build-environment/**'
      - '.github/workflows/pr-build-check.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          # ESP32-S3 (most common platform)
          - Heltec_v3_companion_radio_ble
          - Heltec_v3_repeater
          - Heltec_v3_room_server
          # ESP32-S3 MQTT repeater targets (fork-specific MQTT reporter smoke builds)
          - Heltec_v3_repeater_mqtt
          - heltec_v4_repeater_mqtt
          - LilyGo_TBeam_1W_repeater_mqtt
          # nRF52
          - RAK_4631_companion_radio_ble
          - RAK_4631_companion_radio_ethernet
          - RAK_4631_repeater
          - RAK_4631_repeater_ethernet
          - RAK_4631_room_server
          - RAK_4631_room_server_ethernet
          # RP2040
          - PicoW_repeater
          # STM32
          - wio-e5-mini_repeater
          # ESP32-C6
          - LilyGo_Tlora_C6_repeater_
          # LR1110 (nRF52)
          - wio_wm1110_repeater
          # SX1276 (ESP32)
          - Tbeam_SX1276_repeater

    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

  build-mqtt-ota:
    name: Build MQTT repeater with opt-in OTA
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Compile opt-in MQTT OTA path
        env:
          MESHCORE_MQTT_ENABLE_OTA: '1'
        run: pio run -e Heltec_v3_repeater_mqtt_ota
